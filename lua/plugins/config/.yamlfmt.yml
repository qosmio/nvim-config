---
formatter:
  type: basic
  indent: 2
  include_document_start: true
  line_ending: lf
  max_line_length: 100
  drop_merge_tag: false
  scan_folded_as_literal: false
  retain_line_breaks_single: true
  trim_trailing_whitespace: true
include:
  - .yamlfmt
  - '**/*.yaml'
  - '**/*.yml'
exclude:
  - .direnv/**
